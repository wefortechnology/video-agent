<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width={{RW}}, height={{RH}}" />
<script src="cues.js"></script>
<script src="gsap.min.js"></script>
<script src="kit.js"></script>
<style>
  {{FONTFACES}}
  /* Design system for this video (app/services/design.py): colours, fonts, corners, cards. Templates use only these. */
  :root { {{THEMEVARS}} }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { width: {{RW}}px; height: {{RH}}px; overflow: hidden; background: var(--bg3); }
  body { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .abs { position: absolute; }
  .serif { font-family: var(--font-head); font-weight: var(--head-weight); text-transform: var(--head-case); letter-spacing: var(--head-track); }
  #bg { position: absolute; inset: 0; }
  .bg-radial   { background: radial-gradient(ellipse 120% 85% at 50% 40%, var(--bg1) 0%, var(--bg2) 58%, var(--bg3) 100%); }
  .bg-linear   { background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%); }
  .bg-grid, .bg-dots, .bg-topo, .bg-waves, .bg-blobs { background: radial-gradient(ellipse 120% 90% at 50% 40%, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%); }
  .bg-paper    { background: var(--bg2); }
  .bg-diagonal { background: repeating-linear-gradient(135deg, var(--bg2) 0 46px, var(--bg1) 46px 92px); }
  .bg-split    { background: linear-gradient(162deg, var(--bg1) 0%, var(--bg2) 56%, var(--surface) 56.1%, var(--bg3) 100%); }
  #gridbg { position: absolute; inset: -80px; display: none; }
  .bg-grid ~ #gridbg { display: block; background-image: linear-gradient(var(--gridline) 2px, transparent 2px), linear-gradient(90deg, var(--gridline) 2px, transparent 2px); background-size: 96px 96px; }
  .bg-dots ~ #gridbg { display: block; background-image: radial-gradient(var(--gridline) 3.5px, transparent 4px); background-size: 46px 46px; }
  #bglayer { position: absolute; inset: 0; overflow: hidden; }
  .bk { position: absolute; border-radius: 50%; background: radial-gradient(circle, var(--p1) 0%, var(--p2) 45%, rgba(0,0,0,0) 70%); }
  .dot { position: absolute; border-radius: 50%; background: var(--p1); }
  .bub { position: absolute; border-radius: 50%; border: 3px solid var(--p1); }
  .cfp { position: absolute; border-radius: 3px; }
  .spk { position: absolute; }
  #head { font-family: var(--font-head); font-weight: var(--head-weight); text-transform: var(--head-case); letter-spacing: var(--head-track);
          font-size: {{HEADSIZE}}px; line-height: 1.18; }
  #head.in { position: absolute; left: 70px; width: 940px; top: {{HEADTOP}}px; text-align: center; }
  #head.out { position: relative; text-align: left; }
  #headL { position: absolute; left: {{HLX}}px; top: 0; width: {{HLW}}px; height: {{RH}}px; display: flex; flex-direction: column; justify-content: center; }
  #headL .kick { font-family: var(--font-body); font-size: 28px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); margin-bottom: 26px; }
  #headL .bar { width: 160px; height: 8px; border-radius: 4px; margin-top: 34px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transform-origin: 0 50%; }
  #head .w { display: inline-block; margin: 0 .16em 0 0; }
  #head.in .w { margin: 0 .08em; }
  #head.t-gradient .w { background: linear-gradient(180deg, var(--headA) 0%, var(--headB) 55%, var(--headC) 100%);
                        -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(var(--glow)); }
  #head.t-solid .w, #head.t-underline .w { color: var(--ink); }
  #head.t-highlight .w { color: var(--ink); background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 .06em; }
  #head.in.t-underline::after { content: ""; display: block; width: 200px; height: 10px; margin: 30px auto 0; border-radius: 5px;
                                background: linear-gradient(90deg, var(--accent), var(--accent2)); }
  #fx { position: absolute; inset: 0; }
  #design { position: absolute; left: {{OX}}px; top: {{OY}}px; width: 1080px; height: 1920px; transform: scale({{SCALE}}); transform-origin: 0 0; }
  #brandtag { position: absolute; left: {{BTX}}px; top: {{BTY}}px; width: {{BTW}}px; text-align: {{BTALIGN}}; font-size: {{BTSIZE}}px; font-weight: 700;
              letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); }
  #ez-caption { position: absolute; left: 50%; bottom: {{CAPBOTTOM}}px; transform: translateX(-50%); max-width: {{CAPW}}px; width: max-content;
                padding: 16px 32px; border-radius: min(var(--radius), 26px); background: var(--capbg); border: 2px solid var(--capline);
                color: var(--capfg); font-family: var(--font-body); font-weight: 700; font-size: {{CAPSIZE}}px; line-height: 1.35;
                text-align: center; white-space: normal; opacity: 0; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  #ez-caption .ez-w { display: inline-block; padding: 0 .14em; border-radius: .3em; }
  #ez-series, #ez-tag { display: none; }
  {{BGSTYLE}}
  {{STYLE}}
</style>
</head>
<body>
<div id="root" data-composition-id="{{ID}}" data-start="0" data-duration="{{DURATION}}" data-width="{{RW}}" data-height="{{RH}}" data-fps="{{FPS}}">
  <div id="stage" class="abs" style="inset:0">
    <div id="bg" class="bg-{{BGKIND}}"></div>
    <div id="gridbg"></div>
    <div id="bglayer">{{BGLAYER}}</div>
    <div id="particles" class="abs" style="inset:0"></div>
    <div id="fx">
      <div id="design">
        {{CONTENT}}
        {{HEADIN}}
      </div>
      {{HEADOUT}}
    </div>
    <div id="brandtag">{{BRANDTAG}}</div>
  </div>
</div>
<script>
(function () {
  var tl = gsap.timeline({paused: true, defaults: {ease: "power2.out"}});
  var D = EZ.duration, W = 1080, H = 1920, RW = {{RW}}, RH = {{RH}};  // W/H: design space, RW/RH: output frame
  var MODE = "{{PARTICLES}}", box = document.getElementById("particles");
  var CS = getComputedStyle(document.documentElement), ACC = [CS.getPropertyValue("--accent"), CS.getPropertyValue("--accent2"), CS.getPropertyValue("--accent3")];
  function add(cls, size) { var d = document.createElement("div"); d.className = cls; d.style.width = d.style.height = size + "px";
    d.style.left = (EZ.rand() * RW) + "px"; d.style.top = (EZ.rand() * RH) + "px"; box.appendChild(d); gsap.set(d, {opacity: 0}); return d; }
  var i, d;
  if (MODE === "bokeh") {
    for (i = 0; i < 26; i++) { d = add("bk", 18 + EZ.rand() * 90);
      tl.to(d, {opacity: 0.25 + EZ.rand() * 0.6, duration: 0.8}, EZ.rand() * 0.8);
      tl.to(d, {y: -(80 + EZ.rand() * 260), x: (EZ.rand() - 0.5) * 80, duration: D, ease: "none"}, 0);
      tl.to(d, {opacity: 0.15, duration: 0.6 + EZ.rand(), yoyo: true, repeat: Math.max(1, Math.floor(D / 1.4)), ease: "sine.inOut"}, 1); }
  } else if (MODE === "dots") {
    for (i = 0; i < 14; i++) { d = add("dot", 8 + EZ.rand() * 18);
      tl.to(d, {opacity: 0.2 + EZ.rand() * 0.35, duration: 1.2}, EZ.rand());
      tl.to(d, {y: -(30 + EZ.rand() * 90), x: (EZ.rand() - 0.5) * 60, duration: D, ease: "none"}, 0); }
  } else if (MODE === "bubbles") {
    for (i = 0; i < 12; i++) { d = add("bub", 24 + EZ.rand() * 70);
      tl.to(d, {opacity: 0.5, duration: 0.8}, EZ.rand());
      tl.to(d, {y: -(160 + EZ.rand() * 300), duration: D, ease: "none"}, 0); }
  } else if (MODE === "confetti") {
    for (i = 0; i < 22; i++) { d = add("cfp", 14 + EZ.rand() * 14); d.style.height = (8 + EZ.rand() * 10) + "px"; d.style.top = (-40 - EZ.rand() * RH * 0.4) + "px";
      d.style.background = ACC[i % 3];
      tl.to(d, {opacity: 0.9, duration: 0.3}, EZ.rand() * 1.5);
      tl.to(d, {y: RH * (0.6 + EZ.rand() * 0.7), rotation: (EZ.rand() - 0.5) * 720, x: (EZ.rand() - 0.5) * 160, duration: D, ease: "none"}, 0); }
  } else if (MODE === "sparkles") {
    for (i = 0; i < 18; i++) { d = add("spk", 18 + EZ.rand() * 22);
      d.innerHTML = '<svg viewBox="-10 -10 20 20" width="100%" height="100%"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="' + ACC[i % 3] + '"/></svg>';
      tl.to(d, {opacity: 0.9, scale: 1, duration: 0.4}, EZ.rand() * 1.2);
      tl.to(d, {opacity: 0.15, scale: 0.6, duration: 0.5 + EZ.rand() * 0.6, yoyo: true, repeat: Math.max(1, Math.floor(D / 1.1)), ease: "sine.inOut"}, 1.2); }
  }
  {{BGSCRIPT}}
  tl.fromTo("#gridbg", {y: 0}, {y: 46, duration: D, ease: "none"}, 0);
  // scene transition (design system): fade (kit default) / slide / zoom / wipe
  var TR = "{{TRANSITION}}";
  if (TR === "slide") { tl.fromTo("#fx", {y: 80}, {y: 0, duration: 0.6, ease: "power3.out"}, 0); tl.to("#fx", {y: -60, duration: 0.35, ease: "power2.in"}, D - 0.35); }
  if (TR === "zoom") { tl.fromTo("#fx", {scale: 1.07}, {scale: 1, duration: 0.7, ease: "power3.out", transformOrigin: "50% 50%"}, 0); tl.to("#fx", {scale: 0.96, duration: 0.35, ease: "power2.in"}, D - 0.35); }
  if (TR === "wipe") { tl.fromTo("#fx", {clipPath: "inset(0% 100% 0% 0%)"}, {clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut"}, 0);
                       tl.to("#fx", {clipPath: "inset(0% 0% 0% 100%)", duration: 0.35, ease: "power2.in"}, D - 0.35); }
  gsap.set("#head .w", {opacity: 0, y: 40});
  tl.to("#head .w", {opacity: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "back.out(1.6)"}, 0.25);
  if (document.querySelector("#headL .kick")) { gsap.set("#headL .kick", {opacity: 0, x: -30}); tl.to("#headL .kick", {opacity: 1, x: 0, duration: 0.5}, 0.15); }
  if (document.querySelector("#headL .bar")) { gsap.set("#headL .bar", {scaleX: 0}); tl.to("#headL .bar", {scaleX: 1, duration: 0.6}, 0.7); }
  gsap.set("#brandtag", {opacity: 0});
  tl.to("#brandtag", {opacity: 1, duration: 0.6}, 0.1);
  {{SCRIPT}}
  EZ.finish(tl, {series: false});
  window.__timelines = window.__timelines || {};
  window.__timelines["{{ID}}"] = tl;
})();
</script>
</body>
</html>
